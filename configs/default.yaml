# CurbScope settings. Change values here, not in code.

kitti_dir: ~/data/kitti          # overridden by KITTI_DIR in the Makefile

# Split by drive (owner decision, 2026-11-15). Thresholds are tuned on dev only.
drives:
  dev: [2011_09_26_drive_0022, 2011_09_26_drive_0036]
  test: [2011_09_26_drive_0023]

detect:
  weights: data/weights/yolo11n.pt   # COCO-pretrained, AGPL-3.0, downloaded by `make weights`
  weights_url: https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo11n.pt
  weights_sha256: 0ebbc80d4a7680d14987a577cd21342b65ecfd94632bd9a8da63ae6417644ee1
  imgsz: 1280          # KITTI images are 1242 x 375; 640 would shrink distant cars too much
  conf: 0.1            # Ultralytics' own default for track mode; ByteTrack needs low-score boxes
  classes: [car, motorcycle, bus, truck, fire hydrant, stop sign]   # COCO class names
  tracker: configs/bytetrack.yaml

demo_gif:
  drive: 2011_09_26_drive_0022
  first_frame: 0
  last_frame: 80
  step: 2              # every 2nd frame, played at 5 fps = real time
  width: 560

# M2: 3D position of each box from LiDAR. Set before looking at any result, not tuned.
geo:
  box_keep_fraction: 0.6         # use the central 60% of the box width and height
  lidar_height_m: 1.73           # Velodyne height above the road (KITTI sensor setup)
  min_height_above_ground_m: 0.3 # drop points lower than this: road surface (flat road assumed)
  cluster_gap_m: 0.5             # a jump in distance larger than this starts a new cluster
  min_cluster_points: 5          # smaller clusters in front are noise (branches, poles)
  min_box_points: 10             # fewer points in the box: position unknown

geo_eval:
  tracklet_types: [Car, Van, Truck]
  detection_classes: [car, truck, bus]
  match_max_m: 4.0               # about one car length; fixed before looking at results
  range_bins_m: [0, 10, 20, 40]

# M3: parked or moving. Thresholds are NOT here: the owner picks them on dev drives and
# writes configs/frozen_thresholds.yaml (see scripts/tune.py).
motion:
  min_frames_rule_a: 3           # shorter tracks: rule A cannot decide
  min_known_rule_b: 3            # fewer world positions: rule B cannot decide
  tune_grid:                     # thresholds scripts/tune.py tries on dev drives
    rule_a_max_shift_over_height: [0.25, 0.5, 1.0, 2.0, 3.0, 5.0, 8.0, 12.0, 16.0, 24.0]
    rule_b_max_spread_m: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 4.0, 6.0]
    rule_b_max_speed_mps: [0.5, 1.0, 2.0, 4.0]

# M4: curb segments. Parked = rule B with the owner's frozen thresholds.
segments:
  segment_m: 20.0
  rules: configs/rules_edmonton.yaml
  vehicle_classes: [car, truck, bus, motorcycle]
  curb_offset_range_m: [1.5, 12.0]    # parked vehicles this far left/right of our path count
  default_vehicle_length_m: 4.5       # used (and flagged) when LiDAR cannot measure the length
  vehicle_length_range_m: [2.0, 8.0]  # LiDAR lengths outside this are treated as failures
  min_length_points: 20               # LiDAR points needed, over all frames, to measure length
  display_offset_m: 4.0               # GeoJSON segment lines are drawn this far beside our path

# M5: parking sign OCR. Photos and transcriptions come from the owner.
ocr:
  raw_dir: data/signs                   # the owner's photos (never committed)
  signs_dir: data/signs_clean           # same photos after scripts/strip_exif.py
  groundtruth: labels/signs_groundtruth.csv
  crop_pad_px: 4                        # margin around each detected text line
  tesseract_config: "--psm 7"           # treat each crop as one text line
  trocr_model: microsoft/trocr-base-printed
  trocr_revision: 93450be3f1ed40a930690d951ef3932687cc1892   # pinned model commit
  person_conf: 0.4                      # YOLO confidence to warn about a person in a photo
