[project]
name = "curbscope"
version = "0.1.0"
description = "Curbside parking metrics from KITTI camera, LiDAR and GPS/IMU, plus parking sign OCR."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "opencv-python==4.10.0.84",
    "pykitti==0.3.1",
    "matplotlib==3.9.2",
    "pillow==10.4.0",
    "PyYAML==6.0.2",
    "ultralytics==8.4.196",
    "lap==0.5.13",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "pyproj==3.7.2",
    "scipy==1.15.3",
    "streamlit==1.66.1",
    "shapely==2.2.0",
    "easyocr==1.7.2",
    "pytesseract==0.3.13",
    "transformers==5.22.1",
    "jiwer==4.0.0",
    "folium==0.20.0",
    "streamlit-folium==0.27.4",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
]

# CPU-only torch: the default PyPI wheel on Linux pulls several GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# Indirect dependencies are capped below releases newer than two weeks at lock time
# (2026-11-17), for stability; the PyTorch CPU index has no upload dates, so uv's
# exclude-newer cannot be used.
constraint-dependencies = [
    "annotated-doc<0.0.6",
    "click<8.5.1",
    "filelock<4.2.8",
    "httpcore2<2.16.1",
    "httpx2<2.16.1",
    "imageio<2.38.2",
    "markdown-it-py<4.3.0",
    "narwhals<2.29.0",
    "pyarrow<20",  # pyarrow 20+ needs numpy 2; numpy is pinned to 1.26 (Streamlit tables)
    "pydantic<2.14.3",
    "pydantic-core<2.50.4",
    "python-multipart<0.0.34",
    "regex<2026.11.7",
    "typer<0.28.0",
    "typing-inspection<0.4.5",
    "ultralytics-platform<0.1.103",
    "ultralytics-thop<2.2.5",
]
# EasyOCR asks for opencv-python-headless, which installs the same cv2 module as the
# opencv-python that Ultralytics needs; two copies overwrite each other. Keep only one.
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curbscope"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
