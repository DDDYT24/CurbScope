[project]
name = "curbscope"
version = "0.1.0"
description = "Curbside parking metrics from KITTI camera, LiDAR and GPS/IMU, plus parking sign OCR."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "opencv-python==4.10.0.84",
    "pykitti==0.3.1",
    "matplotlib==3.9.2",
    "pillow==10.4.0",
    "PyYAML==6.0.2",
    "ultralytics==8.4.196",
    "lap==0.5.13",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
]

# CPU-only torch: the default PyPI wheel on Linux pulls several GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curbscope"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
